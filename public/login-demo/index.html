<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>互动登录</title>
  <link rel="icon" type="image/png" href="./logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
      background: #1a1a2e;
      overflow: hidden;
      height: 100vh;
    }

    /* ============ LOGIN PAGE ============ */
    #login-page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
    }

    /* Left Panel */
    .left-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(135deg,
          #d4d0dc 0%,
          #c8c4d0 50%,
          #bbb7c5 100%);
      padding: 40px 48px;
      overflow: hidden;
    }

    .left-panel .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      z-index: 10;
      position: relative;
    }

    .left-panel .logo svg {
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 4px;
      border-radius: 6px;
    }

    .characters-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 420px;
    }

    .left-panel .footer-links {
      display: flex;
      gap: 28px;
      font-size: 13px;
      color: rgba(80, 70, 90, 0.7);
      z-index: 10;
      position: relative;
    }

    .left-panel .footer-links a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }

    .left-panel .footer-links a:hover {
      color: #333;
    }

    /* Decorative blurs */
    .left-panel::after {
      content: "";
      position: absolute;
      top: 20%;
      right: 15%;
      width: 260px;
      height: 260px;
      background: rgba(180, 170, 200, 0.25);
      border-radius: 50%;
      filter: blur(80px);
    }

    .left-panel::before {
      content: "";
      position: absolute;
      bottom: 15%;
      left: 10%;
      width: 350px;
      height: 350px;
      background: rgba(200, 195, 210, 0.2);
      border-radius: 50%;
      filter: blur(100px);
    }

    /* Right Panel */
    .right-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      padding: 40px;
    }

    .form-container {
      width: 100%;
      max-width: 400px;
    }

    /* Sparkle icon */
    .sparkle-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .sparkle-icon svg {
      width: 32px;
      height: 32px;
    }

    .form-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .form-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .form-header p {
      font-size: 14px;
      color: #888;
    }

    /* Form fields */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
    }

    .form-group .input-wrapper {
      position: relative;
    }

    .form-group input {
      width: 100%;
      height: 48px;
      border: none;
      border-bottom: 1.5px solid #e0e0e0;
      padding: 0 40px 0 0;
      font-size: 15px;
      font-family: inherit;
      color: #1a1a2e;
      background: transparent;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      border-bottom-color: #5b21b6;
    }

    .form-group input::placeholder {
      color: #ccc;
    }

    .form-group input[type="password"]:not(:placeholder-shown) {
      font-family: inherit;
      letter-spacing: 2px;
    }

    /* Hide browser-provided password reveal/clear buttons (e.g. Edge) */
    .form-group input[type="password"]::-ms-reveal,
    .form-group input[type="password"]::-ms-clear {
      display: none;
    }

    .toggle-password {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      padding: 6px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #333;
    }

    /* Remember & Forgot */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #555;
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #5b21b6;
      cursor: pointer;
    }

    .forgot-link {
      font-size: 13px;
      color: #5b21b6;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .forgot-link:hover {
      opacity: 0.8;
    }

    /* Buttons */
    .btn-login {
      position: relative;
      width: 100%;
      height: 50px;
      border-radius: 25px;
      border: 1.5px solid #1a1a2e;
      background: #1a1a2e;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      overflow: hidden;
      margin-bottom: 14px;
      transition: all 0.3s;
    }

    .btn-login .btn-text {
      display: inline-block;
      transition: all 0.3s;
    }

    .btn-login .btn-hover-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #5b21b6;
      color: #fff;
      opacity: 0;
      transition: all 0.3s;
      border-radius: 25px;
    }

    .btn-login:hover .btn-text {
      transform: translateX(40px);
      opacity: 0;
    }

    .btn-login:hover .btn-hover-content {
      opacity: 1;
    }

    .btn-google {
      position: relative;
      width: 100%;
      height: 50px;
      border-radius: 25px;
      border: 1.5px solid #e0e0e0;
      background: #f5f5f5;
      color: #333;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.3s;
    }

    .btn-google .btn-text {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
    }

    .btn-google .btn-hover-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #5b21b6;
      color: #fff;
      opacity: 0;
      transition: all 0.3s;
      border-radius: 25px;
    }

    .btn-google:hover .btn-text {
      transform: translateX(40px);
      opacity: 0;
    }

    .btn-google:hover .btn-hover-content {
      opacity: 1;
    }

    .google-icon {
      width: 18px;
      height: 18px;
    }

    /* Sign up link */
    .signup-link {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-top: 32px;
    }

    .signup-link a {
      color: #1a1a2e;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    /* ============ ANIMATED CHARACTERS ============ */
    .characters-scene {
      position: relative;
      width: 480px;
      height: 360px;
    }

    /* Character base styles */
    .character {
      position: absolute;
      bottom: 0;
      /* height(打字增高) 与 translate(打字位移) 是离散状态；倾斜/跟随走 anime 的 transform */
      transition: height 0.7s ease-in-out, translate 0.7s ease-in-out;
      transform-origin: bottom center;
      will-change: transform;
    }

    /* Purple rectangle */
    .char-purple {
      left: 60px;
      width: 170px;
      height: 370px;
      background: #6c3ff5;
      border-radius: 10px 10px 0 0;
      z-index: 1;
    }

    /* Black rectangle */
    .char-black {
      left: 220px;
      width: 115px;
      height: 290px;
      background: #2d2d2d;
      border-radius: 8px 8px 0 0;
      z-index: 2;
    }

    /* Orange semi-circle */
    .char-orange {
      left: 0;
      width: 230px;
      height: 190px;
      background: #ff9b6b;
      border-radius: 115px 115px 0 0;
      z-index: 3;
    }

    /* Yellow rounded */
    .char-yellow {
      left: 290px;
      width: 135px;
      height: 215px;
      background: #e8d754;
      border-radius: 68px 68px 0 0;
      z-index: 4;
    }

    /* Eyes container */
    .eyes {
      position: absolute;
      display: flex;
      /* left/top 是常量基准位；所有位移（跟随 + 姿势）都走 anime 的 transform */
      will-change: transform;
    }

    /* Eyeball (white with pupil) */
    .eyeball {
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: height 0.15s ease;
      overflow: hidden;
    }

    /* Pupil */
    .pupil {
      border-radius: 50%;
      background: #2d2d2d;
      /* transform 交给 anime.js，避免 CSS 过渡与它互相打架 */
      will-change: transform;
    }

    /* Bare pupil (no white eyeball) */
    .bare-pupil {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #2d2d2d;
      will-change: transform;
    }

    /* Yellow mouth */
    .yellow-mouth {
      position: absolute;
      width: 50px;
      height: 4px;
      background: #2d2d2d;
      border-radius: 2px;
      will-change: transform;
    }

    /* Shake-head: smooth left-right oscillation on face parts */
    @keyframes shakeHead {

      0%,
      100% {
        translate: 0 0;
      }

      10% {
        translate: -9px 0;
      }

      20% {
        translate: 7px 0;
      }

      30% {
        translate: -6px 0;
      }

      40% {
        translate: 5px 0;
      }

      50% {
        translate: -4px 0;
      }

      60% {
        translate: 3px 0;
      }

      70% {
        translate: -2px 0;
      }

      80% {
        translate: 1px 0;
      }

      90% {
        translate: -0.5px 0;
      }
    }

    .eyes.shake-head,
    .yellow-mouth.shake-head,
    .orange-mouth.shake-head {
      animation: shakeHead 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Sad mouth (curved down) for orange character on error */
    .orange-mouth {
      position: absolute;
      width: 28px;
      height: 14px;
      border: 3px solid #2d2d2d;
      border-top: none;
      border-radius: 0 0 14px 14px;
      opacity: 0;
      transition: opacity 0.7s ease-in-out;
      will-change: transform;
    }

    .orange-mouth.visible {
      opacity: 1;
    }

    /* Error styles */
    .error-msg {
      display: none;
      padding: 10px 14px;
      font-size: 13px;
      color: #dc2626;
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid rgba(220, 38, 38, 0.2);
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .form-group input.error {
      border-bottom-color: #dc2626;
    }

    .form-group label.error-label {
      color: #dc2626;
    }

    /* Responsive */
    @media (max-width: 900px) {
      #login-page {
        grid-template-columns: 1fr;
      }

      .left-panel {
        display: none;
      }
    }
  </style>
</head>

<body>
  <!-- Login Page -->
  <div id="login-page">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M12 2L15 9H9L12 2Z" />
          <path d="M12 22L9 15H15L12 22Z" />
          <path d="M2 12L9 9V15L2 12Z" />
          <path d="M22 12L15 15V9L22 12Z" />
        </svg>
        <span>CareerCompass</span>
      </div>
      <div class="characters-wrapper">
        <div class="characters-scene" id="characters-scene">
          <!-- Purple character -->
          <div class="character char-purple" id="char-purple">
            <div class="eyes" id="purple-eyes" style="left: 45px; top: 40px; gap: 28px">
              <div class="eyeball" id="purple-eye-l" style="width: 18px; height: 18px">
                <div class="pupil" id="purple-pupil-l" style="width: 7px; height: 7px"></div>
              </div>
              <div class="eyeball" id="purple-eye-r" style="width: 18px; height: 18px">
                <div class="pupil" id="purple-pupil-r" style="width: 7px; height: 7px"></div>
              </div>
            </div>
          </div>
          <!-- Black character -->
          <div class="character char-black" id="char-black">
            <div class="eyes" id="black-eyes" style="left: 26px; top: 32px; gap: 20px">
              <div class="eyeball" id="black-eye-l" style="width: 16px; height: 16px">
                <div class="pupil" id="black-pupil-l" style="width: 6px; height: 6px"></div>
              </div>
              <div class="eyeball" id="black-eye-r" style="width: 16px; height: 16px">
                <div class="pupil" id="black-pupil-r" style="width: 6px; height: 6px"></div>
              </div>
            </div>
          </div>
          <!-- Orange character -->
          <div class="character char-orange" id="char-orange">
            <div class="eyes" id="orange-eyes" style="left: 82px; top: 90px; gap: 28px">
              <div class="bare-pupil" id="orange-pupil-l"></div>
              <div class="bare-pupil" id="orange-pupil-r"></div>
            </div>
            <div class="orange-mouth" id="orange-mouth" style="left: 90px; top: 120px"></div>
          </div>
          <!-- Yellow character -->
          <div class="character char-yellow" id="char-yellow">
            <div class="eyes" id="yellow-eyes" style="left: 52px; top: 40px; gap: 20px">
              <div class="bare-pupil" id="yellow-pupil-l"></div>
              <div class="bare-pupil" id="yellow-pupil-r"></div>
            </div>
            <div class="yellow-mouth" id="yellow-mouth" style="left: 40px; top: 88px"></div>
          </div>
        </div>
      </div>
      <div class="footer-links">
        <a href="#">隐私政策</a>
        <a href="#">服务条款</a>
        <a href="#">联系我们</a>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="form-container">
        <div class="sparkle-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L13.5 9H10.5L12 2Z" fill="#1a1a2e" />
            <path d="M12 22L10.5 15H13.5L12 22Z" fill="#1a1a2e" />
            <path d="M2 12L9 10.5V13.5L2 12Z" fill="#1a1a2e" />
            <path d="M22 12L15 13.5V10.5L22 12Z" fill="#1a1a2e" />
          </svg>
        </div>
        <div class="form-header">
          <h1>欢迎回来！</h1>
          <p>请输入你的登录信息</p>
        </div>

        <form id="login-form" onsubmit="return false;">
          <div class="form-group">
            <label id="email-label" for="email">邮箱</label>
            <div class="input-wrapper">
              <input type="email" id="email" placeholder="you@example.com" autocomplete="off" />
            </div>
          </div>

          <div class="form-group">
            <label id="password-label" for="password">密码</label>
            <div class="input-wrapper">
              <input type="password" id="password" placeholder="••••••••" />
              <button type="button" class="toggle-password" id="toggle-password">
                <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg id="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none">
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                  </path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" checked /> 30 天内保持登录
            </label>
            <a href="#" class="forgot-link">忘记密码？</a>
          </div>

          <div class="error-msg" id="error-msg"></div>

          <button type="submit" class="btn-login" id="btn-login">
            <span class="btn-text">登 录</span>
            <div class="btn-hover-content">
              <span>登 录</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
              </svg>
            </div>
          </button>

          <button type="button" class="btn-google" id="btn-google">
            <span class="btn-text">
              <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                  fill="#4285F4" />
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853" />
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11.96 11.96 0 001 12c0 1.94.46 3.77 1.18 5.07l3.66-2.84v-.14z"
                  fill="#FBBC05" />
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335" />
              </svg>
              使用 Google 登录
            </span>
            <div class="btn-hover-content">
              <span>使用 Google 登录</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
              </svg>
            </div>
          </button>
        </form>

        <div class="signup-link">
          还没有账号？<a href="#">立即注册</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createAnimatable } from "./anime.esm.min.js";

    // ============ 元素引用缓存（只查一次，不进每帧热路径） ============
    const $id = (id) => document.getElementById(id);
    const els = {
      purple: $id("char-purple"),
      black: $id("char-black"),
      orange: $id("char-orange"),
      yellow: $id("char-yellow"),
      purpleEyes: $id("purple-eyes"),
      purpleEyeL: $id("purple-eye-l"),
      purpleEyeR: $id("purple-eye-r"),
      blackEyes: $id("black-eyes"),
      blackEyeL: $id("black-eye-l"),
      blackEyeR: $id("black-eye-r"),
      orangeEyes: $id("orange-eyes"),
      orangeMouth: $id("orange-mouth"),
      yellowEyes: $id("yellow-eyes"),
      yellowMouth: $id("yellow-mouth"),
      password: $id("password"),
      email: $id("email"),
      toggleBtn: $id("toggle-password"),
      eyeIcon: $id("eye-icon"),
      eyeOffIcon: $id("eye-off-icon"),
      errorEl: $id("error-msg"),
      emailLabel: $id("email-label"),
      passwordLabel: $id("password-label"),
      loginForm: $id("login-form"),
      btnLogin: $id("btn-login"),
    };

    // ============ 几何缓存 ============
    // getBoundingClientRect 会强制同步重排 → 只在初始化 / resize 时量一次，热路径不再调用
    const geo = { face: {}, pupil: {} };
    const MEASURE_FACE = [
      ["purple", els.purple],
      ["black", els.black],
      ["orange", els.orange],
      ["yellow", els.yellow],
    ];
    const MEASURE_PUPIL = [
      ["purple", els.purpleEyeL],
      ["black", els.blackEyeL],
      ["orange", $id("orange-pupil-l")],
      ["yellow", $id("yellow-pupil-l")],
    ];

    function measureGeometry() {
      // 量之前先清掉 transform：否则量到的是被 transform 过的 bbox，自身反馈会让坐标漂
      const touched = [];
      MEASURE_FACE.concat(MEASURE_PUPIL).forEach(([, el]) => {
        if (el.style.transform) {
          touched.push([el, el.style.transform]);
          el.style.transform = "";
        }
      });
      MEASURE_FACE.forEach(([key, el]) => {
        const r = el.getBoundingClientRect();
        geo.face[key] = { x: r.left + r.width / 2, y: r.top + r.height / 3 };
      });
      MEASURE_PUPIL.forEach(([key, el]) => {
        const r = el.getBoundingClientRect();
        geo.pupil[key] = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      });
      touched.forEach(([el, v]) => {
        el.style.transform = v;
      });
    }

    // ============ anime.js 可动画对象 ============
    // 跟随（track）：每帧重定目标，短时长 + out 缓动 → 起步快、跟得紧
    // 姿势（pose）：状态切换，0.7s，保持原来的节奏感
    const TRACK_MS = 320;
    const POSE_MS = 700;
    const EASE = "out(2)";
    const mk = (targets, dur) => createAnimatable(targets, { x: dur, y: dur, ease: EASE });
    const anim = {
      purpleEyes: mk("#purple-eyes", TRACK_MS),
      blackEyes: mk("#black-eyes", TRACK_MS),
      orangeEyes: mk("#orange-eyes", TRACK_MS),
      yellowEyes: mk("#yellow-eyes", TRACK_MS),
      // 瞳孔沿用原来的相对手感：紫/黑快（原 0.1s）、橙/黄慢（原 0.7s）
      purplePupil: mk(["#purple-pupil-l", "#purple-pupil-r"], 200),
      blackPupil: mk(["#black-pupil-l", "#black-pupil-r"], 200),
      orangePupil: mk(["#orange-pupil-l", "#orange-pupil-r"], 600),
      yellowPupil: mk(["#yellow-pupil-l", "#yellow-pupil-r"], 600),
      orangeMouth: mk("#orange-mouth", TRACK_MS),
      yellowMouth: createAnimatable("#yellow-mouth", { x: TRACK_MS, y: TRACK_MS, rotate: TRACK_MS, ease: EASE }),
      // 身体倾斜（重心偏一点，比脸慢一拍）
      purpleBody: createAnimatable("#char-purple", { skewX: 420, ease: EASE }),
      blackBody: createAnimatable("#char-black", { skewX: 420, ease: EASE }),
      orangeBody: createAnimatable("#char-orange", { skewX: 420, ease: EASE }),
      yellowBody: createAnimatable("#char-yellow", { skewX: 420, ease: EASE }),
    };

    // 基准位 = HTML 里写死的 left/top；所有姿势都表达成相对它的偏移
    const BASE = {
      purpleEyes: [45, 40],
      blackEyes: [26, 32],
      orangeEyes: [82, 90],
      yellowEyes: [52, 40],
      orangeMouth: [90, 120],
      yellowMouth: [40, 88],
    };

    // 已下发的值，同值不重复起 tween（鼠标静止时零开销）
    const sent = {};
    function send(key, prop, val, dur) {
      const c = sent[key] || (sent[key] = {});
      const prev = c[prop];
      if (prev !== undefined && Math.abs(prev - val) < 0.01) return;
      c[prop] = val;
      if (dur === undefined) anim[key][prop](val);
      else anim[key][prop](val, dur);
    }
    // 状态姿势基准位（离散，走 CSS left/top 过渡）
    function place(key, left, top) {
      const el = els[key];
      const l = left + "px";
      const t = top + "px";
      if (el.style.left !== l) el.style.left = l;
      if (el.style.top !== t) el.style.top = t;
    }
    // 跟随偏移（每帧，走 anime 的 transform，不碰 layout）
    function track(key, dx, dy) {
      send(key, "x", dx);
      send(key, "y", dy);
    }
    // 状态姿势偏移（固定值 + 0.7s）
    function pose(key, dx, dy) {
      send(key, "x", dx, POSE_MS);
      send(key, "y", dy, POSE_MS);
    }
    function posePupil(key, dx, dy) {
      send(key, "x", dx);
      send(key, "y", dy);
    }
    // 身体位移用独立的 CSS translate 属性（与 anime 写的 transform 互不干扰，也躲开 transform 函数顺序问题）
    const bodyShift = {};
    function setBodyShift(key, px) {
      if (bodyShift[key] === px) return;
      bodyShift[key] = px;
      els[key].style.translate = px + "px 0";
    }
    function bodySkew(key, deg, isPose) {
      send(key + "Body", "skewX", deg, isPose ? POSE_MS : undefined);
    }

    // ============ 更新调度：一帧最多跑一次（mousemove 可能一帧触发多次） ============
    let updateRafId = null;
    function scheduleUpdate() {
      if (updateRafId !== null) return;
      updateRafId = requestAnimationFrame(() => {
        updateRafId = null;
        updateCharacters();
      });
    }

    // ============ PASSWORD TOGGLE ============
    let showPassword = false;
    let isLoginError = false;
    els.toggleBtn.addEventListener("click", () => {
      showPassword = !showPassword;
      els.password.type = showPassword ? "text" : "password";
      els.eyeIcon.style.display = showPassword ? "none" : "block";
      els.eyeOffIcon.style.display = showPassword ? "block" : "none";
      if (showPassword) schedulePeek();
      updateCharacters();
    });

    // ============ MOUSE TRACKING & CHARACTER ANIMATION ============
    let mouseX = 0,
      mouseY = 0;
    let isTyping = false;
    let isLookingAtEachOther = false;
    let isPurpleBlinking = false;
    let isBlackBlinking = false;
    let isPurplePeeking = false;
    let typingTimer = null;

    document.addEventListener("mousemove", (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!isTyping && !isLoginError) scheduleUpdate();
    });
    window.addEventListener("resize", () => {
      measureGeometry();
      scheduleUpdate();
    });
    window.addEventListener(
      "scroll",
      () => {
        measureGeometry();
        scheduleUpdate();
      },
      { passive: true },
    );

    let isPasswordFocused = false;

    // Typing detection
    els.email.addEventListener("focus", () => {
      setTyping(true);
    });
    els.email.addEventListener("blur", () => {
      setTyping(false);
    });
    els.email.addEventListener("input", () => {
      updateCharacters();
    });
    els.password.addEventListener("focus", () => {
      isPasswordFocused = true;
      updateCharacters();
    });
    els.password.addEventListener("blur", () => {
      isPasswordFocused = false;
      updateCharacters();
    });
    els.password.addEventListener("input", () => {
      updateCharacters();
    });

    function setTyping(typing) {
      isTyping = typing;
      if (typing) {
        isLookingAtEachOther = true;
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
          isLookingAtEachOther = false;
          updateCharacters();
        }, 800);
      } else {
        isLookingAtEachOther = false;
      }
      updateCharacters();
    }

    // Blinking
    function scheduleBlinkPurple() {
      setTimeout(
        () => {
          isPurpleBlinking = true;
          updateCharacters();
          setTimeout(() => {
            isPurpleBlinking = false;
            updateCharacters();
            scheduleBlinkPurple();
          }, 150);
        },
        Math.random() * 4000 + 3000,
      );
    }

    function scheduleBlinkBlack() {
      setTimeout(
        () => {
          isBlackBlinking = true;
          updateCharacters();
          setTimeout(() => {
            isBlackBlinking = false;
            updateCharacters();
            scheduleBlinkBlack();
          }, 150);
        },
        Math.random() * 4000 + 3000,
      );
    }

    scheduleBlinkPurple();
    scheduleBlinkBlack();

    // Purple peeking when password is visible
    function schedulePeek() {
      if (els.password.value.length > 0 && showPassword) {
        setTimeout(
          () => {
            if (els.password.value.length > 0 && showPassword) {
              isPurplePeeking = true;
              updateCharacters();
              setTimeout(() => {
                isPurplePeeking = false;
                updateCharacters();
                schedulePeek();
              }, 800);
            }
          },
          Math.random() * 3000 + 2000,
        );
      }
    }

    // Calculate character position based on mouse (uses cached geometry)
    function calcPosition(key) {
      const g = geo.face[key];
      const dx = mouseX - g.x;
      const dy = mouseY - g.y;
      const faceX = Math.max(-15, Math.min(15, dx / 20));
      const faceY = Math.max(-10, Math.min(10, dy / 30));
      const bodySkew = Math.max(-6, Math.min(6, -dx / 120));
      return { faceX, faceY, bodySkew };
    }

    function calcPupilOffset(key, maxDist) {
      const g = geo.pupil[key];
      const dx = mouseX - g.x;
      const dy = mouseY - g.y;
      const dist = Math.min(Math.sqrt(dx * dx + dy * dy), maxDist);
      const angle = Math.atan2(dy, dx);
      return { x: Math.cos(angle) * dist, y: Math.sin(angle) * dist };
    }

    function updateCharacters() {
      const pwdLen = els.password.value.length;
      const isShowingPwd = pwdLen > 0 && showPassword;
      // Characters look away when password field is focused (hiding password)
      const isLookingAway = isPasswordFocused && !showPassword;

      const purplePos = calcPosition("purple");
      const blackPos = calcPosition("black");
      const orangePos = calcPosition("orange");
      const yellowPos = calcPosition("yellow");

      // ---- Purple body ----
      if (isShowingPwd) {
        bodySkew("purple", 0, true);
        setBodyShift("purple", 0);
      } else if (isLookingAway) {
        // 密码聚焦：不转头倾斜，保持正立
        bodySkew("purple", 0, true);
        setBodyShift("purple", 0);
      } else if (isTyping) {
        bodySkew("purple", purplePos.bodySkew - 12, true);
        setBodyShift("purple", 40);
      } else {
        bodySkew("purple", purplePos.bodySkew);
        setBodyShift("purple", 0);
      }
      els.purple.style.height = isTyping ? "410px" : "370px";

      // Purple eyes
      els.purpleEyeL.style.background = isLookingAway || isShowingPwd || isPurpleBlinking ? "#000" : "white";
      els.purpleEyeL.style.height = isLookingAway || isShowingPwd ? "1px" : isPurpleBlinking ? "2px" : "18px";
      els.purpleEyeR.style.background = isLookingAway || isShowingPwd || isPurpleBlinking ? "#000" : "white";
      els.purpleEyeR.style.height = isLookingAway || isShowingPwd ? "1px" : isPurpleBlinking ? "2px" : "18px";

      if (isLoginError) {
        // Sad look down-left
        place("purpleEyes", ...BASE.purpleEyes);
        pose("purpleEyes", -15, 15);
        posePupil("purplePupil", -3, 4);
      } else if (isShowingPwd) {
        place("purpleEyes", ...BASE.purpleEyes);
        pose("purpleEyes", -25, -5);
        const px = isPurplePeeking ? 4 : -4;
        const py = isPurplePeeking ? 5 : -4;
        posePupil("purplePupil", px, py);
      } else if (isLookingAtEachOther) {
        place("purpleEyes", ...BASE.purpleEyes);
        pose("purpleEyes", 10, 25);
        posePupil("purplePupil", 3, 4);
      } else {
        place("purpleEyes", ...BASE.purpleEyes);
        track("purpleEyes", purplePos.faceX, purplePos.faceY);
        const po = calcPupilOffset("purple", 5);
        posePupil("purplePupil", po.x, po.y);
      }

      // ---- Black body ----
      if (isShowingPwd) {
        bodySkew("black", 0, true);
        setBodyShift("black", 0);
      } else if (isLookingAway) {
        // 密码聚焦：不转头倾斜，保持正立
        bodySkew("black", 0, true);
        setBodyShift("black", 0);
      } else if (isLookingAtEachOther) {
        bodySkew("black", blackPos.bodySkew * 1.5 + 10, true);
        setBodyShift("black", 20);
      } else if (isTyping) {
        bodySkew("black", blackPos.bodySkew * 1.5, true);
        setBodyShift("black", 0);
      } else {
        bodySkew("black", blackPos.bodySkew);
        setBodyShift("black", 0);
      }

      // Black eyes
      els.blackEyeL.style.background = isBlackBlinking ? "#000" : "white";
      els.blackEyeL.style.height = isLookingAway || isShowingPwd ? "16px" : isBlackBlinking ? "2px" : "16px";
      els.blackEyeR.style.background = isBlackBlinking ? "#000" : "white";
      els.blackEyeR.style.height = isLookingAway || isShowingPwd ? "16px" : isBlackBlinking ? "2px" : "16px";

      if (isLoginError) {
        place("blackEyes", ...BASE.blackEyes);
        pose("blackEyes", -11, 8);
        posePupil("blackPupil", -3, 4);
      } else if (isLookingAway) {
        // 聚焦密码：睁眼好奇地盯着右侧输入框看（与紫色闭眼形成对比）
        place("blackEyes", ...BASE.blackEyes);
        pose("blackEyes", 16, -4);
        posePupil("blackPupil", 4, 0);
      } else if (isShowingPwd) {
        place("blackEyes", ...BASE.blackEyes);
        pose("blackEyes", -16, -4);
        posePupil("blackPupil", -4, -4);
      } else if (isLookingAtEachOther) {
        place("blackEyes", ...BASE.blackEyes);
        pose("blackEyes", 6, -20);
        posePupil("blackPupil", 0, -4);
      } else {
        place("blackEyes", ...BASE.blackEyes);
        track("blackEyes", blackPos.faceX, blackPos.faceY);
        const bo = calcPupilOffset("black", 4);
        posePupil("blackPupil", bo.x, bo.y);
      }

      // ---- Orange body ----
      if (isShowingPwd) {
        bodySkew("orange", 0, true);
      } else {
        bodySkew("orange", orangePos.bodySkew);
      }

      // Orange mouth：出错时才摆到下方（基准位 90,120）
      if (isLoginError) {
        place("orangeMouth", ...BASE.orangeMouth);
        pose("orangeMouth", orangePos.faceX - 10, 10);
      }

      // Orange eyes
      if (isLoginError) {
        place("orangeEyes", ...BASE.orangeEyes);
        pose("orangeEyes", -22, 5);
        posePupil("orangePupil", -3, 4);
      } else if (isLookingAway) {
        place("orangeEyes", ...BASE.orangeEyes);
        pose("orangeEyes", -32, -15);
        posePupil("orangePupil", -5, -5);
      } else if (isShowingPwd) {
        place("orangeEyes", ...BASE.orangeEyes);
        pose("orangeEyes", -32, -5);
        posePupil("orangePupil", -5, -4);
      } else {
        place("orangeEyes", ...BASE.orangeEyes);
        track("orangeEyes", orangePos.faceX, orangePos.faceY);
        const oo = calcPupilOffset("orange", 5);
        posePupil("orangePupil", oo.x, oo.y);
      }

      // ---- Yellow body ----
      if (isShowingPwd) {
        bodySkew("yellow", 0, true);
      } else {
        bodySkew("yellow", yellowPos.bodySkew);
      }

      // Yellow eyes & mouth
      if (isLoginError) {
        place("yellowEyes", ...BASE.yellowEyes);
        pose("yellowEyes", -17, 5);
        posePupil("yellowPupil", -3, 4);
        place("yellowMouth", ...BASE.yellowMouth);
        pose("yellowMouth", -10, 4);
        send("yellowMouth", "rotate", -8, POSE_MS);
      } else if (isLookingAway) {
        place("yellowEyes", ...BASE.yellowEyes);
        pose("yellowEyes", -32, -10);
        posePupil("yellowPupil", -5, -5);
        place("yellowMouth", ...BASE.yellowMouth);
        pose("yellowMouth", -25, -10);
        send("yellowMouth", "rotate", 0, POSE_MS);
      } else if (isShowingPwd) {
        place("yellowEyes", ...BASE.yellowEyes);
        pose("yellowEyes", -32, -5);
        posePupil("yellowPupil", -5, -4);
        place("yellowMouth", ...BASE.yellowMouth);
        pose("yellowMouth", -30, 0);
        send("yellowMouth", "rotate", 0, POSE_MS);
      } else {
        place("yellowEyes", ...BASE.yellowEyes);
        track("yellowEyes", yellowPos.faceX, yellowPos.faceY);
        const yo = calcPupilOffset("yellow", 5);
        posePupil("yellowPupil", yo.x, yo.y);
        place("yellowMouth", ...BASE.yellowMouth);
        track("yellowMouth", yellowPos.faceX, yellowPos.faceY);
        send("yellowMouth", "rotate", 0, POSE_MS);
      }
    }

    // ============ LOGIN ERROR ANIMATION ============
    let errorRecoverTimer = null;
    const shakeIds = [
      "purple-eyes",
      "black-eyes",
      "orange-eyes",
      "yellow-eyes",
      "yellow-mouth",
      "orange-mouth",
    ];

    function triggerLoginError() {
      // Clear any previous error recovery timer so repeated clicks work
      if (errorRecoverTimer) {
        clearTimeout(errorRecoverTimer);
        errorRecoverTimer = null;
      }

      // Reset shake animation (remove class, force reflow, re-add)
      const shakeEls = shakeIds.map((id) => document.getElementById(id));
      shakeEls.forEach((el) => el.classList.remove("shake-head"));
      // Force reflow to restart animation even on repeated clicks
      void document.body.offsetHeight;

      isLoginError = true;
      isPasswordFocused = false;
      updateCharacters();

      // Show sad mouth on orange
      document.getElementById("orange-mouth").classList.add("visible");

      // Start shake after sad pose settles (the 0.7s body transition)
      setTimeout(() => {
        shakeEls.forEach((el) => el.classList.add("shake-head"));
      }, 350);

      // Recover after 2.5 seconds
      errorRecoverTimer = setTimeout(() => {
        isLoginError = false;
        errorRecoverTimer = null;
        document.getElementById("orange-mouth").classList.remove("visible");
        shakeEls.forEach((el) => el.classList.remove("shake-head"));
        updateCharacters();
      }, 2500);
    }

    // ============ FORM VALIDATION ============
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = els.email.value.trim();
      const pwd = els.password.value;

      // Reset
      els.errorEl.style.display = "none";
      els.email.classList.remove("error");
      els.password.classList.remove("error");
      els.emailLabel.classList.remove("error-label");
      els.passwordLabel.classList.remove("error-label");

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        els.email.classList.add("error");
        els.emailLabel.classList.add("error-label");
        els.errorEl.textContent = "请输入有效的邮箱地址。";
        els.errorEl.style.display = "block";
        triggerLoginError();
        return;
      }

      if (!pwd || pwd.length < 6) {
        els.password.classList.add("error");
        els.passwordLabel.classList.add("error-label");
        els.errorEl.textContent = "密码至少需要 6 个字符。";
        els.errorEl.style.display = "block";
        triggerLoginError();
        return;
      }

      // Simulate login (always fails for demo to show the animation)
      els.btnLogin.querySelector(".btn-text").textContent = "登录中...";
      els.btnLogin.disabled = true;

      setTimeout(() => {
        els.btnLogin.querySelector(".btn-text").textContent = "登 录";
        els.btnLogin.disabled = false;
        els.errorEl.textContent = "邮箱或密码错误，请重试。";
        els.errorEl.style.display = "block";
        els.password.classList.add("error");
        els.passwordLabel.classList.add("error-label");
        triggerLoginError();
      }, 1500);
    });

    // Initial render
    measureGeometry();
    updateCharacters();
  </script>
</body>

</html>
