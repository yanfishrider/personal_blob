<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NieR Grid Drawing</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1512; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const CELL = 6;       // 网格单元格 px
const GAP = 1;        // 单元格间距
const STEP = CELL + GAP;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); draw(); });

/* ============ 像素字体定义 (5x7 大写字母 + 数字 + 符号) ============ */
const FONT = {
  'A':['01110','10001','10001','11111','10001','10001','10001'],
  'B':['11110','10001','10001','11110','10001','10001','11110'],
  'C':['01110','10001','10000','10000','10000','10001','01110'],
  'D':['11110','10001','10001','10001','10001','10001','11110'],
  'E':['11111','10000','10000','11110','10000','10000','11111'],
  'F':['11111','10000','10000','11110','10000','10000','10000'],
  'G':['01110','10001','10000','10111','10001','10001','01110'],
  'H':['10001','10001','10001','11111','10001','10001','10001'],
  'I':['01110','00100','00100','00100','00100','00100','01110'],
  'K':['10001','10010','10100','11000','10100','10010','10001'],
  'L':['10000','10000','10000','10000','10000','10000','11111'],
  'M':['10001','11011','10101','10101','10001','10001','10001'],
  'N':['10001','11001','10101','10011','10001','10001','10001'],
  'O':['01110','10001','10001','10001','10001','10001','01110'],
  'R':['11110','10001','10001','11110','10100','10010','10001'],
  'S':['01110','10001','10000','01110','00001','10001','01110'],
  'T':['11111','00100','00100','00100','00100','00100','00100'],
  'U':['10001','10001','10001','10001','10001','10001','01110'],
  'Y':['10001','10001','01010','00100','00100','00100','00100'],
  'a':['00000','01110','00001','01111','10001','10011','01101'],
  'e':['00000','01110','10001','11111','10000','10001','01110'],
  'f':['00010','00100','01110','00100','00100','00100','00100'],
  'h':['10000','10000','11110','10001','10001','10001','10001'],
  'i':['00100','00000','01100','00100','00100','00100','01110'],
  'k':['10000','10010','10100','11000','10100','10010','10001'],
  'l':['01100','00100','00100','00100','00100','00100','01110'],
  'm':['00000','00000','11010','10101','10101','10001','10001'],
  'n':['00000','00000','11110','10001','10001','10001','10001'],
  'o':['00000','00000','01110','10001','10001','10001','01110'],
  'r':['00000','00000','10110','11001','10000','10000','10000'],
  't':['00100','00100','01110','00100','00100','00100','00010'],
  'u':['00000','00000','10001','10001','10001','10011','01101'],
  'y':['00000','00000','10001','10001','01010','00100','11000'],
  ' ':['00000','00000','00000','00000','00000','00000','00000'],
  '.':['00000','00000','00000','00000','00000','01100','01100'],
  ':':['00000','01100','01100','00000','01100','01100','00000'],
  '-':['00000','00000','00000','11111','00000','00000','00000'],
  '%':['11001','11010','00010','00100','01000','01011','10011'],
};

/* ============ YoRHa 徽章像素图 (16x20 近似) ============ */
// 1 = 亮灰色填充, 0 = 空
const EMBLEM = [
  '0000000110000000',
  '0000001111000000',
  '0000011111100000',
  '0000011111100000',
  '0000111101110000',
  '0000111000110000',
  '0001111001111000',
  '0001110010011000',
  '0011100110011100',
  '0011000110001100',
  '0010000100001000',
  '0110001100011000',
  '0110000100001100',
  '0100111111110010',
  '1101111111111011',
  '1001111111111001',
  '1000111000111001',
  '1000110000110001',
  '1000100000010001',
  '1000000000000001',
];

/* 绘制单个字符 (基准位置 x0,y0 是左上角) */
function drawChar(ch, x0, y0, color) {
  const rows = FONT[ch];
  if (!rows) return;
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) {
      if (rows[r][c] === '1') {
        ctx.fillStyle = color;
        ctx.fillRect(x0 + c * STEP, y0 + r * STEP, CELL, CELL);
      }
    }
  }
}

/* 绘制文本字符串 */
function drawText(str, x0, y0, color) {
  let cx = x0;
  for (const ch of str) {
    drawChar(ch, cx, y0, color);
    cx += (ch === ' ' ? 4 : 6) * STEP;
  }
}

/* 绘制徽章 */
function drawEmblem(x0, y0, color) {
  for (let r = 0; r < EMBLEM.length; r++) {
    for (let c = 0; c < EMBLEM[r].length; c++) {
      if (EMBLEM[r][c] === '1') {
        ctx.fillStyle = color;
        ctx.fillRect(x0 + c * STEP, y0 + r * STEP, CELL, CELL);
      }
    }
  }
}

/* ============ 主绘制 ============ */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ── 背景：深色 + 网格点 ──
  ctx.fillStyle = '#1a1512';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 细密点阵
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for (let x = 0; x < canvas.width; x += 5) {
    for (let y = 0; y < canvas.height; y += 5) {
      ctx.fillRect(x, y, 1, 1);
    }
  }

  // ── 网格线 ──
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < canvas.width; x += STEP) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += STEP) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // ── 计算 YoRHa 整体居中 ──
  const emblemW = 16 * STEP;
  const emblemH = 20 * STEP;
  const textW = 6 * 5 * STEP; // "YoRHa" 5 chars
  const sloganW = 6 * 23 * STEP; // "For the Glory of Mankind"
  const totalW = emblemW + 2 * STEP + textW;
  const totalH = emblemH + STEP + 8 * STEP; // emblem + gap + slogan

  const centerX = (canvas.width - totalW) / 2;
  const centerY = (canvas.height - totalH) / 2;

  const alpha = 0.25;

  // ── 徽章 ──
  drawEmblem(centerX, centerY, `rgba(200,200,210,${alpha})`);

  // ── YoRHa ──
  drawText('YoRHa', centerX + emblemW + 2 * STEP, centerY + 5 * STEP, `rgba(200,200,210,${alpha * 1.4})`);

  // ── 标语 ──
  const sloganX = centerX + emblemW + 2 * STEP;
  const sloganY = centerY + emblemH - 2 * STEP;
  // 缩放标语用小字
  drawTextSmall('For the Glory of Mankind', sloganX, sloganY, `rgba(180,180,195,${alpha * 0.9})`);

  // ── LOADING 标题 (左上) ──
  drawText('LOADING', 3 * STEP, 3 * STEP, 'rgba(220,220,230,0.45)');
}

/* 小号文本 (3x5 字体) */
const FONT_SMALL = {
  'A':['111','101','111','101','101'],
  'B':['110','101','110','101','110'],
  'C':['111','100','100','100','111'],
  'D':['110','101','101','101','110'],
  'E':['111','100','110','100','111'],
  'F':['111','100','110','100','100'],
  'G':['111','100','101','101','111'],
  'H':['101','101','111','101','101'],
  'I':['111','010','010','010','111'],
  'K':['101','110','100','110','101'],
  'L':['100','100','100','100','111'],
  'M':['101','111','101','101','101'],
  'N':['101','111','111','101','101'],
  'O':['111','101','101','101','111'],
  'R':['110','101','110','101','101'],
  'T':['111','010','010','010','010'],
  'Y':['101','101','010','010','010'],
  'a':['000','110','011','101','011'],
  'd':['001','001','011','101','011'],
  'e':['000','110','111','100','110'],
  'f':['011','010','111','010','010'],
  'g':['000','011','101','011','110'],
  'h':['100','100','110','101','101'],
  'i':['010','000','010','010','010'],
  'k':['100','101','110','110','101'],
  'l':['010','010','010','010','010'],
  'm':['000','111','101','101','101'],
  'n':['000','110','101','101','101'],
  'o':['000','111','101','101','111'],
  'r':['000','110','101','100','100'],
  't':['010','111','010','010','001'],
  ' ':['000','000','000','000','000'],
  '.':['000','000','000','000','010'],
};

function drawCharSmall(ch, x0, y0, color) {
  const rows = FONT_SMALL[ch];
  if (!rows) return;
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) {
      if (rows[r][c] === '1') {
        ctx.fillStyle = color;
        ctx.fillRect(x0 + c * STEP, y0 + r * STEP, CELL, CELL);
      }
    }
  }
}

function drawTextSmall(str, x0, y0, color) {
  let cx = x0;
  for (const ch of str) {
    drawCharSmall(ch, cx, y0, color);
    cx += (ch === ' ' ? 2 : 4) * STEP;
  }
}

draw();
</script>
</body>
</html>
